<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Boost Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #10152f, #25205a, #542b75);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .tag {
      color: #d7b8ff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #c8c5e3;
      margin-bottom: 28px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: #e1dcff;
      font-size: 14px;
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    #progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a78bfa, #f0abfc);
      transition: width 0.3s ease;
    }

    #question {
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    #answers {
      display: grid;
      gap: 12px;
    }

    #answers button {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    #answers button:hover {
      background: rgba(167, 139, 250, 0.3);
      border-color: #c4b5fd;
      transform: translateY(-2px);
    }

    #answers button:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    #result {
      min-height: 28px;
      margin-top: 18px;
      font-weight: bold;
      color: #f0abfc;
    }

    #score {
      font-weight: bold;
      color: #f0abfc;
    }

    #next-btn {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #next-btn:hover {
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .quiz-card {
        padding: 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-card">
    <p class="tag">✨ Challenge your mind</p>
    <h1>Brain Boost</h1>
    <p class="subtitle">Test your knowledge. Beat your best score.</p>

    <div class="info">
      <span id="question-number">Question 1</span>
      <span>Score: <span id="score">0</span></span>
    </div>

    <div class="progress-track">
      <div id="progress"></div>
    </div>

    <p id="question">Loading questions...</p>
    <div id="answers"></div>
    <p id="result"></p>

    <button id="next-btn">Next Question →</button>
  </main>

  <script src="quiz.js"></script>
</body>
</html>
